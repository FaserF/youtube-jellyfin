backend:
  - changed-files:
    - any-glob-to-any-file:
      - 'Jellyfin.Plugin.YouTube/**/*.cs'
      - 'Jellyfin.Plugin.YouTube.csproj'

frontend:
  - changed-files:
    - any-glob-to-any-file: 'Jellyfin.Plugin.YouTube/Features/Script/**/*.js'

tests:
  - changed-files:
    - any-glob-to-any-file: 'Jellyfin.Plugin.YouTube.Tests/**/*'

ci-cd:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'docs/**/*'
